spring.application.name=sistema-papelaria-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/papelaria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# spring.web.mvc.cors.allowed-origins=*
# spring.web.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.mvc.cors.allowed-headers=*

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
